<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- PHASE 44 — favicon (browsers were showing the generic globe) + a short
         description for the tab/preview. The app is a private, auth-gated internal
         tool, so one static description is the right call — no per-route SEO. -->
    <link rel="icon" type="image/svg+xml" href="/baps-logo-color.svg" />
    <link rel="apple-touch-icon" href="/baps-logo-color.svg" />
    <meta name="description" content="BAPS Jaipur MDS — contact, calling, and sabha management for karyekartas." />
    <!-- Cream, matching bg-cream-100 in tailwind.config.js. Set here as well as in
         index.css so the first paint and the mobile browser chrome are already the
         right colour — without it, Android Chrome tints its address bar white and a
         slow stylesheet shows a white flash before the canvas arrives. -->
    <meta name="theme-color" content="#F6F2EA" />
    <style>html, body { background-color: #F6F2EA; }</style>
    <title>BAPS Jaipur MDS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
